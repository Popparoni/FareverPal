[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "farever_native"
version = "0.1.0"
description = "Read-only Windows process memory reader for the Farever Companion"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
module-name = "farever_native"
