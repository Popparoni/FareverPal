[package]
name = "farever_native"
version = "0.1.0"
edition = "2021"
description = "Read-only Windows process memory reader for the Farever Companion"

[lib]
name = "farever_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
